services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etrat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-etrat}
    command: postgres -c shared_buffers=128MB -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hosseinshisfahani/university-backend:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-etrat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etrat}
    volumes:
      - ./data/media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/hosseinshisfahani/university-frontend:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:13002:3000"
    depends_on:
      - backend
    mem_limit: 384m

volumes:
  pgdata:
